<!DOCTYPE html>
<html lang="en-GB" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Annual Leave Manager — Contoso UK (Sample)</title>
<style>
/* ───────────────────────── Design tokens ───────────────────────── */
:root{
  --accent:#0078D4; --accent-hover:#106EBE; --accent-pressed:#005A9E; --accent-soft:rgba(0,120,212,.12);
  --bg:#F3F2F1; --surface:#FFFFFF; --surface-2:#FAF9F8; --surface-3:#EDEBE9;
  --text:#201F1E; --text-2:#605E5C; --text-3:#8A8886; --border:#E1DFDD; --border-strong:#C8C6C4;
  --success:#107C10; --success-soft:rgba(16,124,16,.14); --warning:#C19C00; --warning-soft:rgba(255,185,0,.18); --warning-text:#7A5B00;
  --danger:#D13438; --danger-soft:rgba(209,52,56,.14); --info:#0078D4; --info-soft:rgba(0,120,212,.12);
  --shadow-1:0 1.6px 3.6px rgba(0,0,0,.13),0 .3px .9px rgba(0,0,0,.11);
  --shadow-2:0 6.4px 14.4px rgba(0,0,0,.13),0 1.2px 3.6px rgba(0,0,0,.11);
  --shadow-3:0 25.6px 57.6px rgba(0,0,0,.22),0 4.8px 14.4px rgba(0,0,0,.18);
  --radius:6px; --radius-lg:10px; --nav-w:240px; --top-h:56px;
  --font:"Segoe UI","Segoe UI Web (West European)",-apple-system,BlinkMacSystemFont,Roboto,"Helvetica Neue",Arial,sans-serif;
  --skeleton-a:#EDEBE9; --skeleton-b:#F8F7F6;
  color-scheme:light;
}
html[data-theme="dark"]{
  --accent:#2899F5; --accent-hover:#3AA0FF; --accent-pressed:#0078D4; --accent-soft:rgba(40,153,245,.18);
  --bg:#1B1A19; --surface:#252423; --surface-2:#2D2C2B; --surface-3:#3B3A39;
  --text:#F3F2F1; --text-2:#C8C6C4; --text-3:#979593; --border:#3B3A39; --border-strong:#605E5C;
  --success:#6CCB5F; --success-soft:rgba(108,203,95,.18); --warning:#FCE100; --warning-soft:rgba(252,225,0,.16); --warning-text:#FCE100;
  --danger:#F1707B; --danger-soft:rgba(241,112,123,.18); --info:#2899F5; --info-soft:rgba(40,153,245,.18);
  --skeleton-a:#2D2C2B; --skeleton-b:#3B3A39;
  --shadow-1:0 1.6px 3.6px rgba(0,0,0,.4),0 .3px .9px rgba(0,0,0,.3);
  --shadow-2:0 6.4px 14.4px rgba(0,0,0,.5),0 1.2px 3.6px rgba(0,0,0,.4);
  --shadow-3:0 25.6px 57.6px rgba(0,0,0,.6),0 4.8px 14.4px rgba(0,0,0,.5);
  color-scheme:dark;
}
@media (prefers-color-scheme: dark){
  html:not([data-theme="light"]){
    --accent:#2899F5; --accent-hover:#3AA0FF; --accent-pressed:#0078D4; --accent-soft:rgba(40,153,245,.18);
    --bg:#1B1A19; --surface:#252423; --surface-2:#2D2C2B; --surface-3:#3B3A39;
    --text:#F3F2F1; --text-2:#C8C6C4; --text-3:#979593; --border:#3B3A39; --border-strong:#605E5C;
    --success:#6CCB5F; --success-soft:rgba(108,203,95,.18); --warning:#FCE100; --warning-soft:rgba(252,225,0,.16); --warning-text:#FCE100;
    --danger:#F1707B; --danger-soft:rgba(241,112,123,.18); --info:#2899F5; --info-soft:rgba(40,153,245,.18);
    --skeleton-a:#2D2C2B; --skeleton-b:#3B3A39;
    color-scheme:dark;
  }
}

/* ───────────────────────── Base ───────────────────────── */
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:var(--font);font-size:14px;line-height:1.45;color:var(--text);background:var(--bg);-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{margin:0;font-weight:600;line-height:1.25}
h1{font-size:24px}h2{font-size:18px}h3{font-size:15px}h4{font-size:12px;color:var(--text-2);text-transform:uppercase;letter-spacing:.04em}
p{margin:0 0 .75em}
a{color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:2px}
.sr-only{position:absolute;inline-size:1px;block-size:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.muted{color:var(--text-2)}
.small{font-size:12px}
.mono{font-family:Consolas,"Cascadia Mono",monospace;font-size:12px}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.between{justify-content:space-between}
.grow{flex:1 1 auto}
.stack{display:flex;flex-direction:column;gap:8px}
.mt{margin-block-start:16px}.mb{margin-block-end:16px}
.hidden{display:none !important}
.right{text-align:end}
.nowrap{white-space:nowrap}
ul.plain{margin:0 0 .75em;padding-inline-start:20px}

/* ───────────────────────── App shell ───────────────────────── */
.app{display:grid;grid-template-columns:var(--nav-w) 1fr;grid-template-rows:var(--top-h) 1fr;min-block-size:100vh}
.topbar{grid-column:1/-1;position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:12px;padding-inline:12px 16px;background:var(--surface);border-block-end:1px solid var(--border);box-shadow:var(--shadow-1)}
.brand{display:flex;align-items:center;gap:10px;font-weight:600;font-size:16px;inline-size:calc(var(--nav-w) - 12px)}
.brand .logo{inline-size:32px;block-size:32px;border-radius:8px;background:linear-gradient(135deg,var(--accent),#50E6FF);display:grid;place-items:center;color:#fff;font-weight:700;flex:none}
.brand .sub{display:block;font-size:11px;font-weight:400;color:var(--text-2)}
.hamburger{display:none}
.search{position:relative;flex:1 1 320px;max-inline-size:520px}
.search input{inline-size:100%;padding:8px 12px 8px 36px;border:1px solid var(--border-strong);border-radius:var(--radius);background:var(--surface-2)}
.search input:focus{border-color:var(--accent);background:var(--surface)}
.search>svg{position:absolute;inset-inline-start:12px;inset-block-start:50%;transform:translateY(-50%);inline-size:16px;block-size:16px;fill:var(--text-2);pointer-events:none}
.search-results{position:absolute;inset-inline:0;inset-block-start:calc(100% + 4px);background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow-2);max-block-size:360px;overflow:auto;z-index:60}
.search-results button{display:flex;gap:10px;align-items:center;inline-size:100%;text-align:start;padding:8px 12px;border:0;background:none;cursor:pointer}
.search-results button:hover,.search-results button:focus{background:var(--surface-2)}
.search-results .kind{font-size:11px;color:var(--text-3);min-inline-size:60px;text-transform:uppercase}
.topbar .actions{display:flex;align-items:center;gap:4px;margin-inline-start:auto}
.role-switch{display:flex;border:1px solid var(--border-strong);border-radius:var(--radius);overflow:hidden}
.role-switch button{padding:6px 10px;border:0;background:var(--surface);cursor:pointer;font-size:13px}
.role-switch button[aria-pressed="true"]{background:var(--accent);color:#fff}
.icon-btn{position:relative;inline-size:36px;block-size:36px;display:grid;place-items:center;border:0;border-radius:var(--radius);background:transparent;cursor:pointer;color:var(--text)}
.icon-btn:hover{background:var(--surface-3)}
.icon-btn svg{inline-size:20px;block-size:20px;fill:currentColor}
.badge-dot{position:absolute;inset-block-start:4px;inset-inline-end:4px;min-inline-size:16px;block-size:16px;padding-inline:4px;border-radius:8px;background:var(--danger);color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center}
.avatar{inline-size:32px;block-size:32px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:600;color:#fff;background:var(--accent);flex:none}
.avatar.sm{inline-size:24px;block-size:24px;font-size:10px}
.avatar.lg{inline-size:48px;block-size:48px;font-size:16px}
.user-chip{display:flex;align-items:center;gap:8px;padding:4px 8px 4px 4px;border-radius:20px;border:0;background:transparent;cursor:pointer;text-align:start}
.user-chip:hover{background:var(--surface-3)}
.user-chip .name{font-weight:600;font-size:13px;line-height:1.1}
.user-chip .title{font-size:11px;color:var(--text-2)}
.popover{position:absolute;inset-block-start:calc(var(--top-h) - 6px);inset-inline-end:16px;inline-size:360px;max-inline-size:calc(100vw - 24px);background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);box-shadow:var(--shadow-3);z-index:70;overflow:hidden}
.popover header{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-block-end:1px solid var(--border);font-weight:600}
.popover .list{max-block-size:380px;overflow:auto}
.notif{display:flex;gap:10px;padding:10px 14px;border-block-end:1px solid var(--border);cursor:pointer;background:none;border-inline:0;border-block-start:0;inline-size:100%;text-align:start}
.notif:hover{background:var(--surface-2)}
.notif.unread{background:var(--accent-soft)}
.notif .dot{inline-size:8px;block-size:8px;border-radius:50%;background:var(--accent);margin-block-start:6px;flex:none}
.notif.read .dot{background:transparent}
.notif time{display:block;font-size:11px;color:var(--text-3)}

nav.sidenav{grid-row:2;position:sticky;top:var(--top-h);block-size:calc(100vh - var(--top-h));overflow:auto;background:var(--surface);border-inline-end:1px solid var(--border);padding:12px 8px;display:flex;flex-direction:column}
.sidenav ul{list-style:none;margin:0;padding:0}
.sidenav li a{display:flex;align-items:center;gap:12px;padding:9px 12px;margin-block:2px;border-radius:var(--radius);color:var(--text);text-decoration:none;font-weight:500;position:relative}
.sidenav li a:hover{background:var(--surface-3)}
.sidenav li a[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
.sidenav li a[aria-current="page"]::before{content:"";position:absolute;inset-inline-start:0;inset-block:8px;inline-size:3px;border-radius:2px;background:var(--accent)}
.sidenav svg{inline-size:20px;block-size:20px;fill:currentColor;flex:none}
.sidenav .count{margin-inline-start:auto;font-size:11px;background:var(--danger);color:#fff;border-radius:10px;padding:1px 7px;font-weight:600}
.sidenav .nav-foot{margin-block-start:auto;padding:12px;font-size:11px;color:var(--text-3);border-block-start:1px solid var(--border)}
.sidenav .persona{display:flex;gap:10px;align-items:center;padding:8px 12px 14px;border-block-end:1px solid var(--border);margin-block-end:8px}
.sidenav .persona .name{font-weight:600}
.sidenav .persona .role{font-size:11px;color:var(--text-2)}

main{grid-column:2;grid-row:2;padding:20px 24px 80px;min-inline-size:0}
.breadcrumb{display:flex;gap:6px;align-items:center;font-size:12px;color:var(--text-2);margin-block-end:10px}
.breadcrumb a{color:var(--text-2);text-decoration:none}
.breadcrumb a:hover{text-decoration:underline}
.page-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-block-end:18px}
.page-head p{color:var(--text-2);margin:4px 0 0}

/* ───────────────────────── Components ───────────────────────── */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);box-shadow:var(--shadow-1);padding:16px}
.card h3{margin-block-end:10px}
.card-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-block-end:12px}
.card-head h3{margin:0}
.grid{display:grid;gap:16px}
.grid.kpis{grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}
.grid.two{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.grid.three{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.kpi{padding:14px 16px 14px 20px;position:relative;overflow:hidden}
.kpi .label{font-size:12px;color:var(--text-2);font-weight:600;text-transform:uppercase;letter-spacing:.03em}
.kpi .value{font-size:28px;font-weight:700;margin-block:4px;line-height:1.1}
.kpi .value small{font-size:13px;font-weight:500;color:var(--text-2)}
.kpi .hint{font-size:12px;color:var(--text-3)}
.kpi::after{content:"";position:absolute;inset-inline-start:0;inset-block:0;inline-size:4px;background:var(--kpi-color,var(--accent))}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:7px 14px;border-radius:var(--radius);border:1px solid var(--border-strong);background:var(--surface);color:var(--text);cursor:pointer;font-weight:600;font-size:13px;min-block-size:32px;text-decoration:none;white-space:nowrap}
.btn:hover{background:var(--surface-3)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:var(--accent-hover)}
.btn.danger{background:var(--danger);border-color:var(--danger);color:#fff}
.btn.subtle{border-color:transparent;background:transparent}
.btn.subtle:hover{background:var(--surface-3)}
.btn.sm{padding:4px 10px;min-block-size:26px;font-size:12px}
.btn svg{inline-size:16px;block-size:16px;fill:currentColor}
.btn.success{background:var(--success);border-color:var(--success);color:#fff}
.chip{display:inline-flex;align-items:center;gap:6px;padding:2px 10px;border-radius:12px;font-size:12px;font-weight:600;line-height:18px;white-space:nowrap}
.chip::before{content:"";inline-size:7px;block-size:7px;border-radius:50%;background:currentColor}
.chip.draft{background:var(--surface-3);color:var(--text-2)}
.chip.pending{background:var(--warning-soft);color:var(--warning-text)}
.chip.amended{background:var(--info-soft);color:var(--accent)}
.chip.approved{background:var(--success-soft);color:var(--success)}
.chip.rejected{background:var(--danger-soft);color:var(--danger)}
.chip.cancelled{background:var(--surface-3);color:var(--text-3)}
.type-dot{display:inline-block;inline-size:10px;block-size:10px;border-radius:3px;margin-inline-end:6px;vertical-align:-1px}
.tag{display:inline-block;padding:1px 8px;border-radius:4px;background:var(--surface-3);font-size:11px;font-weight:600;color:var(--text-2)}
.table-wrap{overflow:auto;border:1px solid var(--border);border-radius:var(--radius);max-block-size:70vh;background:var(--surface)}
table{inline-size:100%;border-collapse:separate;border-spacing:0;font-size:13px}
thead th{position:sticky;top:0;z-index:2;background:var(--surface-2);text-align:start;padding:10px 12px;font-weight:600;border-block-end:1px solid var(--border);white-space:nowrap}
thead th button{all:unset;cursor:pointer;display:inline-flex;gap:4px;align-items:center;font-weight:600}
thead th button:hover{color:var(--accent)}
tbody td{padding:9px 12px;border-block-end:1px solid var(--border);vertical-align:middle}
tbody tr:hover td{background:var(--surface-2)}
tbody tr.highlight td{background:var(--accent-soft)}
tbody tr:last-child td{border-block-end:0}
td input[type=number]{inline-size:70px;padding:4px 6px;border:1px solid var(--border-strong);border-radius:4px;background:var(--surface)}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:12px;font-weight:600;color:var(--text-2)}
.field input,.field select,.field textarea{padding:7px 10px;border:1px solid var(--border-strong);border-radius:var(--radius);background:var(--surface);min-block-size:32px}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 1px var(--accent)}
.field textarea{min-block-size:80px;resize:vertical}
.field .help{font-size:11px;color:var(--text-3)}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin-block-end:12px}
.filters .field{min-inline-size:140px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-block-end:12px}
.progress{block-size:8px;border-radius:4px;background:var(--surface-3);overflow:hidden;min-inline-size:80px}
.progress span{display:block;block-size:100%;background:var(--accent);border-radius:4px}
.progress span.warn{background:var(--warning)}
.progress span.bad{background:var(--danger)}
.alert{display:flex;gap:10px;padding:10px 12px;border-radius:var(--radius);border:1px solid;font-size:13px;align-items:flex-start}
.alert svg{inline-size:18px;block-size:18px;flex:none;fill:currentColor;margin-block-start:1px}
.alert.error{background:var(--danger-soft);border-color:var(--danger);color:var(--text)}
.alert.error svg{fill:var(--danger)}
.alert.warn{background:var(--warning-soft);border-color:var(--warning);color:var(--text)}
.alert.warn svg{fill:var(--warning-text)}
.alert.ok{background:var(--success-soft);border-color:var(--success)}
.alert.ok svg{fill:var(--success)}
.alert.info{background:var(--info-soft);border-color:var(--accent)}
.alert.info svg{fill:var(--accent)}
.empty{text-align:center;padding:32px 16px;color:var(--text-2)}
.empty svg{inline-size:56px;block-size:56px;fill:var(--text-3);margin-block-end:8px}
.list{list-style:none;margin:0;padding:0}
.list li{display:flex;gap:12px;align-items:center;padding:10px 0;border-block-end:1px solid var(--border)}
.list li:last-child{border-block-end:0}
.list .when{min-inline-size:90px;font-size:12px;color:var(--text-2)}
.date-block{inline-size:44px;block-size:44px;border-radius:8px;background:var(--surface-3);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;flex:none}
.date-block b{font-size:16px}
.date-block span{font-size:10px;text-transform:uppercase;color:var(--text-2)}
.feed li{align-items:flex-start}
.feed .avatar{margin-block-start:2px}
.feed time{font-size:11px;color:var(--text-3);display:block}
.kbd{display:inline-block;padding:0 6px;border:1px solid var(--border-strong);border-block-end-width:2px;border-radius:4px;font-family:inherit;font-size:11px;background:var(--surface-2)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--text-2)}
.legend span{display:inline-flex;gap:6px;align-items:center}
.tabs{display:flex;gap:2px;border-block-end:1px solid var(--border);margin-block-end:16px;overflow:auto}
.tabs button{padding:8px 14px;border:0;border-block-end:2px solid transparent;background:none;cursor:pointer;font-weight:600;color:var(--text-2);white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--accent);border-color:var(--accent)}
.switch{position:relative;inline-size:40px;block-size:20px;border-radius:10px;background:var(--border-strong);border:0;cursor:pointer;flex:none;padding:0}
.switch::after{content:"";position:absolute;inset-block-start:2px;inset-inline-start:2px;inline-size:16px;block-size:16px;border-radius:50%;background:#fff;transition:transform .15s}
.switch[aria-checked="true"]{background:var(--accent)}
.switch[aria-checked="true"]::after{transform:translateX(20px)}
.rule-row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-block-end:1px solid var(--border)}
.rule-row:last-child{border-block-end:0}
.rule-row .desc{font-size:12px;color:var(--text-2)}
.color-swatch{inline-size:22px;block-size:22px;border-radius:6px;border:1px solid var(--border);display:inline-block;vertical-align:middle}

/* Wizard */
.steps{display:flex;gap:0;margin:0 0 20px;padding:0;counter-reset:s}
.steps li{flex:1;list-style:none;display:flex;align-items:center;gap:8px;padding:8px 10px;border-block-end:3px solid var(--border);color:var(--text-2);font-size:13px;font-weight:600}
.steps li::before{counter-increment:s;content:counter(s);inline-size:24px;block-size:24px;border-radius:50%;display:grid;place-items:center;background:var(--surface-3);font-size:12px;flex:none}
.steps li.active{color:var(--accent);border-color:var(--accent)}
.steps li.active::before{background:var(--accent);color:#fff}
.steps li.done{color:var(--success);border-color:var(--success)}
.steps li.done::before{content:"✓";background:var(--success);color:#fff}
.type-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}
.type-card{text-align:start;padding:12px;border:2px solid var(--border);border-radius:var(--radius-lg);background:var(--surface);cursor:pointer;display:flex;flex-direction:column;gap:4px}
.type-card:hover{border-color:var(--border-strong)}
.type-card[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.type-card .name{font-weight:600;display:flex;align-items:center;gap:8px}
.type-card .name i{inline-size:12px;block-size:12px;border-radius:50%;display:inline-block}
.type-card .desc{font-size:12px;color:var(--text-2)}
.seg{display:inline-flex;border:1px solid var(--border-strong);border-radius:var(--radius);overflow:hidden}
.seg button{border:0;background:var(--surface);padding:5px 10px;cursor:pointer;font-size:12px;font-weight:600}
.seg button[aria-pressed="true"]{background:var(--accent);color:#fff}
.summary{display:grid;grid-template-columns:140px 1fr;gap:6px 12px;font-size:13px;margin:0}
.summary dt{color:var(--text-2)}
.summary dd{margin:0;font-weight:500}
.wizard-foot{display:flex;justify-content:space-between;gap:8px;margin-block-start:20px;padding-block-start:16px;border-block-start:1px solid var(--border);flex-wrap:wrap}
.calc-days{font-size:32px;font-weight:700;color:var(--accent)}
.att{display:flex;gap:8px;align-items:center;padding:6px 10px;border:1px dashed var(--border-strong);border-radius:var(--radius);font-size:12px}
.mini-cal{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;font-size:11px;text-align:center}
.mini-cal div{padding:4px 0;border-radius:4px}
.mini-cal .h{color:var(--text-3);font-weight:600}
.mini-cal .we{color:var(--text-3)}
.mini-cal .bh{background:var(--danger-soft);color:var(--danger)}
.mini-cal .sel{background:var(--accent);color:#fff}
.mini-cal .half{background:linear-gradient(135deg,var(--accent) 50%,var(--surface-3) 50%);color:var(--text)}

/* Calendar */
.cal-head{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-block-end:12px}
.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;background:var(--border);gap:1px}
.cal-grid .dow{background:var(--surface-2);padding:6px;text-align:center;font-size:12px;font-weight:600;color:var(--text-2)}
.cal-cell{background:var(--surface);min-block-size:104px;padding:6px 4px 4px;display:flex;flex-direction:column;gap:2px;position:relative}
.cal-cell.other{background:var(--surface-2);color:var(--text-3)}
.cal-cell.weekend{background:var(--surface-2)}
.cal-cell.today .dnum{background:var(--accent);color:#fff}
.cal-cell .dnum{inline-size:24px;block-size:24px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:600;align-self:flex-start}
.cal-cell .heat{position:absolute;inset-block-start:0;inset-inline:0;block-size:3px}
.cal-cell.bh{background:var(--danger-soft)}
.cal-cell.blackout::after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(135deg,transparent 0 8px,rgba(209,52,56,.10) 8px 12px)}
.cal-cell .bh-label,.cal-cell .bo-label{font-size:10px;color:var(--danger);font-weight:600;line-height:1.2}
.lv-chip{display:flex;align-items:center;gap:4px;font-size:11px;padding:1px 6px;border-radius:4px;color:#fff;border:0;cursor:pointer;text-align:start;inline-size:100%;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font-weight:500;line-height:16px}
.lv-chip.pending,.lv-chip.amended{opacity:.75;outline:1px dashed rgba(255,255,255,.9);outline-offset:-2px}
.lv-chip:hover{filter:brightness(1.1)}
.cal-cell .more{font-size:10px;color:var(--text-2);margin-block-start:auto}
.week-grid{display:grid;grid-template-columns:180px repeat(7,1fr);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;background:var(--border);gap:1px}
.week-grid>div{background:var(--surface);padding:6px 8px;min-block-size:38px;font-size:12px;display:flex;align-items:center;gap:6px}
.week-grid .hd{background:var(--surface-2);font-weight:600;color:var(--text-2);flex-direction:column;align-items:center;gap:0;justify-content:center}
.week-grid .hd.today{color:var(--accent)}
.week-grid .name{font-weight:500;background:var(--surface-2)}
.week-grid .we{background:var(--surface-2)}
.week-grid .bhc{background:var(--danger-soft)}
.week-grid .lv{inline-size:100%;block-size:100%;min-block-size:26px;border-radius:4px;color:#fff;font-size:11px;padding:3px 6px;border:0;cursor:pointer;text-align:start}
.week-grid .lv.pending,.week-grid .lv.amended{opacity:.75;outline:1px dashed rgba(255,255,255,.9);outline-offset:-2px}
.cap-row{display:grid;grid-template-columns:180px repeat(7,1fr);gap:1px;margin-block-start:8px}
.cap{text-align:center;font-size:11px;padding:4px;border-radius:4px;font-weight:600}

/* Approvals */
.appr{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:start;padding:14px;border:1px solid var(--border);border-radius:var(--radius-lg);background:var(--surface);margin-block-end:10px}
.appr .meta{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12px;color:var(--text-2);margin-block-start:6px}
.appr .acts{display:flex;flex-direction:column;gap:6px;align-items:stretch;min-inline-size:150px}
.appr.selected{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.appr input[type=checkbox]{inline-size:18px;block-size:18px;margin-block-start:10px}
.sla{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;padding:1px 8px;border-radius:10px}
.sla.ok{background:var(--success-soft);color:var(--success)}
.sla.warn{background:var(--warning-soft);color:var(--warning-text)}
.sla.bad{background:var(--danger-soft);color:var(--danger)}
.conflict{display:inline-flex;align-items:center;gap:4px;font-size:11px;color:var(--danger);font-weight:600}

/* Charts */
.chart{inline-size:100%;block-size:auto;font-family:var(--font);display:block}
.chart text{fill:var(--text-2);font-size:11px}
.chart .grid-line{stroke:var(--border);stroke-width:1}
.chart .bar{fill:var(--accent)}
.chart .bar:hover{fill:var(--accent-hover)}
.chart .axis{stroke:var(--border-strong)}
.chart .line{fill:none;stroke:var(--danger);stroke-width:2}
.chart .dotp{fill:var(--danger)}
.donut-wrap{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.donut-legend{display:flex;flex-direction:column;gap:6px;font-size:12px;flex:1;min-inline-size:140px}
.donut-legend span{display:flex;align-items:center;gap:8px}
.donut-legend b{margin-inline-start:auto}

/* Drawer / Modal / Toast */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:80;display:flex;align-items:center;justify-content:center;padding:16px}
.drawer{position:fixed;inset-block:0;inset-inline-end:0;inline-size:480px;max-inline-size:100vw;background:var(--surface);box-shadow:var(--shadow-3);z-index:90;display:flex;flex-direction:column;animation:slide .18s ease-out}
@keyframes slide{from{transform:translateX(20px);opacity:0}to{transform:none;opacity:1}}
.drawer header{display:flex;align-items:center;gap:8px;padding:14px 16px;border-block-end:1px solid var(--border)}
.drawer header h2{flex:1}
.drawer .body{padding:16px;overflow:auto;flex:1}
.drawer footer{padding:12px 16px;border-block-start:1px solid var(--border);display:flex;gap:8px;flex-wrap:wrap}
.modal{background:var(--surface);border-radius:var(--radius-lg);box-shadow:var(--shadow-3);inline-size:520px;max-inline-size:100%;max-block-size:90vh;display:flex;flex-direction:column;animation:pop .15s ease-out}
.modal.wide{inline-size:820px}
@keyframes pop{from{transform:scale(.97);opacity:0}to{transform:none;opacity:1}}
.modal header{padding:16px 20px 8px;font-size:18px;font-weight:600;display:flex;justify-content:space-between;align-items:center}
.modal .body{padding:8px 20px 16px;overflow:auto}
.modal footer{padding:12px 20px 16px;display:flex;justify-content:flex-end;gap:8px}
.timeline{list-style:none;margin:0;padding:0;position:relative}
.timeline::before{content:"";position:absolute;inset-inline-start:9px;inset-block:6px;inline-size:2px;background:var(--border)}
.timeline li{position:relative;padding-inline-start:30px;padding-block:6px}
.timeline li::before{content:"";position:absolute;inset-inline-start:4px;inset-block-start:11px;inline-size:12px;block-size:12px;border-radius:50%;background:var(--surface);border:2px solid var(--accent)}
.timeline li.approved::before{border-color:var(--success);background:var(--success)}
.timeline li.rejected::before,.timeline li.cancelled::before{border-color:var(--danger);background:var(--danger)}
.timeline time{display:block;font-size:11px;color:var(--text-3)}
.toasts{position:fixed;inset-block-end:16px;inset-inline-end:16px;display:flex;flex-direction:column;gap:8px;z-index:120;max-inline-size:360px}
.toast{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:var(--radius);background:var(--surface);border:1px solid var(--border);border-inline-start:4px solid var(--accent);box-shadow:var(--shadow-2);animation:pop .15s ease-out}
.toast.success{border-inline-start-color:var(--success)}
.toast.error{border-inline-start-color:var(--danger)}
.toast.warn{border-inline-start-color:var(--warning)}
.toast .close{margin-inline-start:auto;border:0;background:none;cursor:pointer;color:var(--text-2);font-size:16px;line-height:1}

/* Skeleton */
.skeleton{background:linear-gradient(90deg,var(--skeleton-a) 25%,var(--skeleton-b) 50%,var(--skeleton-a) 75%);background-size:200% 100%;animation:shimmer 1.2s infinite;border-radius:6px}
@keyframes shimmer{to{background-position:-200% 0}}

/* Responsive */
@media (max-width: 900px){
  .app{grid-template-columns:1fr}
  nav.sidenav{position:fixed;inset-block:var(--top-h) 0;inset-inline-start:0;inline-size:var(--nav-w);transform:translateX(-100%);transition:transform .2s;z-index:50}
  nav.sidenav.open{transform:none;box-shadow:var(--shadow-3)}
  main{grid-column:1;padding:14px 12px 80px}
  .hamburger{display:grid}
  .brand{inline-size:auto}
  .brand .sub{display:none}
  .search{flex:1 1 120px}
  .role-switch button{padding:6px 7px;font-size:12px}
  .user-chip .name,.user-chip .title{display:none}
  .drawer{inline-size:100vw}
  .cal-cell{min-block-size:64px}
  .appr{grid-template-columns:auto 1fr}
  .appr .acts{grid-column:1/-1;flex-direction:row;flex-wrap:wrap}
  .week-grid,.cap-row{grid-template-columns:90px repeat(7,1fr)}
  .summary{grid-template-columns:1fr}
  .steps li span{display:none}
}
@media (max-width:600px){
  .role-switch{display:none}
  .search{display:none}
}
@media print{
  .topbar,nav.sidenav,.toasts,.no-print,.breadcrumb{display:none !important}
  .app{display:block}
  main{padding:0}
  .card{box-shadow:none;break-inside:avoid}
  body{background:#fff;color:#000}
  .table-wrap{max-block-size:none;overflow:visible}
}
@media (prefers-reduced-motion: reduce){*{animation:none !important;transition:none !important}}

/* Hydrate the store from SEED and build realistic audit timelines. */
function seedStore() {
  const clone = o => JSON.parse(JSON.stringify(o));
  state.teams = clone(SEED.teams);
  state.employees = clone(SEED.employees);
  state.leaveTypes = clone(SEED.leaveTypes);
  state.bankHolidays = clone(SEED.bankHolidays);
  state.blackouts = clone(SEED.blackouts);
  state.policy = clone(SEED.policy);
  state.notifications = clone(SEED.notifications);
  state.requests = SEED.requests.map(row => {
    const [id, employeeId, typeId, start, end, status, notes, startHalf = '', endHalf = '', extra = {}] = row;
    const emp = empById(employeeId);
    const days = workingDays(emp, start, end, startHalf, endHalf);
    const submittedAt = addDays(start, -Math.max(7, Math.round(days * 2) + 3)) + 'T09:15:00';
    const decidedAt = addDays(start, -Math.max(5, Math.round(days * 2))) + 'T14:20:00';
    const approverId = emp.managerId || 'e12';
    const approver = empById(approverId);
    const timeline = [{ at: submittedAt, by: employeeId, action: 'submitted', note: 'Request submitted' }];
    const approvals = [{ step: 1, role: emp.managerId ? 'manager' : 'hr', approverId, status: 'pending' }];
    if (status === 'approved') {
      approvals[0].status = 'approved'; approvals[0].at = decidedAt;
      timeline.push({ at: decidedAt, by: approverId, action: 'approved', note: `Approved by ${approver.name}` });
    } else if (status === 'rejected') {
      approvals[0].status = 'rejected'; approvals[0].at = decidedAt;
      timeline.push({ at: decidedAt, by: approverId, action: 'rejected', note: extra.reason || 'Rejected' });
    } else if (status === 'cancelled') {
      approvals[0].status = 'approved'; approvals[0].at = decidedAt;
      timeline.push({ at: decidedAt, by: approverId, action: 'approved', note: `Approved by ${approver.name}` });
      timeline.push({ at: addDays(start, -2) + 'T10:00:00', by: employeeId, action: 'cancelled', note: notes });
    } else if (status === 'amended') {
      timeline.push({ at: addDays(start, -20) + 'T11:00:00', by: employeeId, action: 'amended', note: 'Dates changed after blackout warning' });
    } else if (status === 'draft') {
      timeline.length = 0; timeline.push({ at: '2026-09-18T16:40:00', by: employeeId, action: 'draft', note: 'Draft saved' });
    }
    if (extra.step2) {
      approvals[0].status = 'approved'; approvals[0].at = '2026-09-19T15:00:00';
      approvals.push({ step: 2, role: 'hr', approverId: 'e12', status: 'pending' });
      timeline.push({ at: '2026-09-19T15:00:00', by: approverId, action: 'approved', note: `Step 1 approved by ${approver.name} — routed to HR (over ${state.policy.hrApprovalThresholdDays} days)` });
    }
    // Make the manager queue interesting: a few requests waiting for different lengths of time.
    if (status === 'pending' && !extra.step2) {
      const waitMap = { 'R-1014': 9, 'R-1017': 3, 'R-1018': 1, 'R-1020': 2, 'R-1008': 4, 'R-1023': 4, 'R-1026': 6, 'R-1035': 2 };
      const w = waitMap[id] ?? 3;
      timeline[0].at = addDays(TODAY, -w) + 'T09:15:00';
    }
    return {
      id, employeeId, typeId, start, end, status, notes: notes || '', startHalf, endHalf, days,
      coverId: extra.coverId || null, reason: extra.reason || null,
      attachments: typeById(typeId).requiresEvidence && status === 'approved' ? [{ name: `${typeId}-evidence.pdf`, size: '84 KB' }] : [],
      createdAt: timeline[0].at, timeline, approvals,
    };
  });
}

/* ───────────────────────────── DOMAIN ───────────────────────────── */
const bankHolidaySet = () => new Set(state.bankHolidays.map(b => b.date));
const isWeekend = iso => { const d = parseISO(iso).getDay(); return d === 0 || d === 6; };
const isWorkingDay = (emp, iso, bh = bankHolidaySet()) => {
  const dow = parseISO(iso).getDay();
  if (bh.has(iso)) return false;
  const wd = emp?.workingDays || [1, 2, 3, 4, 5];
  return wd.includes(dow);
};
function eachDay(start, end, fn) { for (let d = start; d <= end; d = addDays(d, 1)) fn(d); }

/* Working days in a range for an employee, excluding weekends/non-working days
   and bank holidays, adjusted for half days. */
function workingDays(emp, start, end, startHalf = '', endHalf = '') {
  if (!start || !end || end < start) return 0;
  const bh = bankHolidaySet();
  let days = 0;
  eachDay(start, end, d => { if (isWorkingDay(emp, d, bh)) days += 1; });
  if (days === 0) return 0;
  if (start === end) { if (startHalf) days -= 0.5; }
  else { if (startHalf === 'PM' && isWorkingDay(emp, start, bh)) days -= 0.5; if (endHalf === 'AM' && isWorkingDay(emp, end, bh)) days -= 0.5; }
  return Math.max(0, days);
}
/* Working days from TODAY (exclusive) to `start` (exclusive) — notice given. */
function noticeWorkingDays(emp, start) {
  if (start <= TODAY) return 0;
  let n = 0; const bh = bankHolidaySet();
  eachDay(addDays(TODAY, 1), addDays(start, -1), d => { if (isWorkingDay(emp, d, bh)) n++; });
  return n;
}
const ACTIVE = new Set(['pending', 'amended', 'approved']);
const PENDING = new Set(['pending', 'amended']);
const overlaps = (a1, a2, b1, b2) => a1 <= b2 && b1 <= a2;

/* Annual-leave balance for an employee for the leave year. */
function balanceFor(empId) {
  const emp = empById(empId);
  const p = state.policy;
  const reqs = state.requests.filter(r => r.employeeId === empId && typeById(r.typeId).deducts && r.start.slice(0, 4) === String(YEAR));
  let taken = 0, booked = 0, pending = 0, takenBeforeExpiry = 0;
  reqs.forEach(r => {
    if (r.status === 'approved') {
      if (r.end < TODAY) taken += r.days; else booked += r.days;
      if (r.end <= p.carryOverExpiry) takenBeforeExpiry += r.days;
    } else if (PENDING.has(r.status)) pending += r.days;
  });
  const carryOver = Math.min(emp.carryOver || 0, p.carryOverMax);
  const carryUsed = Math.min(carryOver, takenBeforeExpiry);
  const carryExpiringUnused = Math.max(0, carryOver - carryUsed);
  const carryExpired = TODAY > p.carryOverExpiry ? carryExpiringUnused : 0;
  const total = emp.entitlement + carryOver - carryExpired;
  const remaining = total - taken - booked;
  const available = remaining - pending;
  const daysToExpiry = daysBetween(TODAY, p.carryOverExpiry);
  return { entitlement: emp.entitlement, carryOver, carryUsed, carryExpiringUnused, carryExpired, daysToExpiry, total, taken, booked, pending, remaining, available, toil: emp.toil || 0 };
}

/* Team coverage: highest % of the team off on any working day in the range,
   excluding `excludeEmpId`. Returns { pct, peak, people:[...] } */
function teamCoverage(teamId, start, end, excludeEmpId = null, includePending = true) {
  const members = teamMembers(teamId).filter(e => e.id !== excludeEmpId);
  if (!members.length) return { pct: 0, peakDate: null, people: [] };
  const statuses = includePending ? ACTIVE : new Set(['approved']);
  const offReqs = state.requests.filter(r => statuses.has(r.status) && r.employeeId !== excludeEmpId && members.some(m => m.id === r.employeeId) && overlaps(r.start, r.end, start, end));
  let peak = 0, peakDate = null; const people = new Set();
  eachDay(start, end, d => {
    if (isWeekend(d)) return;
    const off = offReqs.filter(r => r.start <= d && d <= r.end);
    off.forEach(r => people.add(r.employeeId));
    if (off.length > peak) { peak = off.length; peakDate = d; }
  });
  return { pct: Math.round(100 * peak / (members.length + (excludeEmpId ? 1 : 0))), peak, peakDate, people: [...people].map(empById), teamSize: members.length + (excludeEmpId ? 1 : 0) };
}
function blackoutsFor(teamId, start, end) {
  return state.blackouts.filter(b => (b.teamId === null || b.teamId === teamId) && overlaps(b.start, b.end, start, end));
}

/* Validate a draft request; returns { errors:[], warnings:[], days } */
function validateRequest(draft, excludeId = null) {
  const errors = [], warnings = [];
  const emp = empById(draft.employeeId);
  const type = typeById(draft.typeId);
  const p = state.policy;
  if (!draft.typeId) errors.push('Choose a leave type.');
  if (!draft.start || !draft.end) { errors.push('Choose a start and end date.'); return { errors, warnings, days: 0 }; }
  if (draft.end < draft.start) errors.push('End date must be on or after the start date.');
  const days = workingDays(emp, draft.start, draft.end, draft.startHalf, draft.endHalf);
  if (days === 0 && draft.end >= draft.start) errors.push('The selected range contains no working days (weekends / bank holidays / non-working days).');
  if (draft.start.slice(0, 4) !== String(YEAR) || draft.end.slice(0, 4) !== String(YEAR)) warnings.push(`This request falls outside the ${YEAR} leave year; balances shown are for ${YEAR}.`);
  // Overlap
  const clash = state.requests.find(r => r.id !== excludeId && r.employeeId === draft.employeeId && ACTIVE.has(r.status) && overlaps(r.start, r.end, draft.start, draft.end));
  if (clash) errors.push(`Overlaps your existing ${clash.status} request ${clash.id} (${fmtRange(clash.start, clash.end)}).`);
  // Balance
  if (type.deducts) {
    const bal = balanceFor(draft.employeeId);
    const avail = bal.available + (excludeId ? (reqById(excludeId)?.days || 0) : 0);
    if (days > avail) {
      const msg = `Insufficient balance: ${fmtDays(days)} requested but only ${fmtDays(Math.max(0, avail))} available (after pending requests).`;
      p.allowNegativeBalance ? warnings.push(msg + ' Negative balance is permitted by policy.') : errors.push(msg);
    }
  }
  // Notice period (annual/unpaid/study/toil only; sick, compassionate, parental exempt)
  if (p.enforceNotice && ['annual', 'unpaid', 'study', 'toil'].includes(draft.typeId) && draft.start > TODAY) {
    const required = Math.max(p.minNoticeDays, Math.ceil(days * p.noticeMultiplier));
    const given = noticeWorkingDays(emp, draft.start);
    if (given < required) errors.push(`Notice period: ${required} working days' notice required for ${fmtDays(days)} (max of ${p.minNoticeDays} and ${p.noticeMultiplier}× duration); only ${given} given.`);
  }
  if (draft.start < TODAY && !['sick', 'compassionate'].includes(draft.typeId)) warnings.push('Start date is in the past — retrospective requests require manager confirmation.');
  // Max consecutive
  if (days > p.maxConsecutiveDays && type.id !== 'parental') errors.push(`Exceeds the maximum of ${p.maxConsecutiveDays} consecutive working days (${fmtDays(days)} requested).`);
  // Blackouts
  if (p.enforceBlackouts) blackoutsFor(emp.teamId, draft.start, draft.end).forEach(b => {
    const msg = `Blackout period "${b.name}" (${fmtRange(b.start, b.end)}): ${b.note}`;
    (b.hard && type.id === 'annual') ? errors.push(msg) : warnings.push(msg);
  });
  // Team coverage
  if (p.enforceCoverage && emp.teamId) {
    const cov = teamCoverage(emp.teamId, draft.start, draft.end, emp.id);
    const pctWithMe = Math.round(100 * (cov.peak + 1) / cov.teamSize);
    if (pctWithMe > p.teamCoverageWarnPct) warnings.push(`Team coverage: ${pctWithMe}% of ${teamById(emp.teamId).name} would be off on ${fmtDateShort(cov.peakDate || draft.start)} (${cov.people.map(x => x.name).join(', ')}). Threshold is ${p.teamCoverageWarnPct}%.`);
  }
  // Evidence
  if (type.requiresEvidence && !(draft.attachments || []).length) {
    if (type.id === 'sick' && days <= p.sickSelfCertDays) warnings.push(`Self-certification applies (≤ ${p.sickSelfCertDays} days). A fit note is required beyond that.`);
    else warnings.push(`${type.name} normally requires supporting evidence — attach a document or your manager may request one.`);
  }
  return { errors, warnings, days };
}

/* Who should approve step N of a request? */
function approverForStep(req, step) {
  const emp = empById(req.employeeId);
  if (step === 1) return emp.managerId || 'e12';
  return 'e12'; // HR
}
function effectiveApprover(approverId) {
  const d = state.delegations.find(x => x.fromId === approverId && x.from <= TODAY && TODAY <= x.to);
  return d ? d.toId : approverId;
}
function currentApproval(req) { return req.approvals.find(a => a.status === 'pending'); }
function waitingDays(req) { const sub = [...req.timeline].reverse().find(t => t.action === 'submitted' || t.action === 'amended'); return sub ? Math.max(0, daysBetween(sub.at.slice(0, 10), TODAY)) : 0; }

/* Approval queue visible to the current user. */
function approvalQueue(userId) {
  const user = empById(userId);
  return state.requests.filter(r => {
    if (!PENDING.has(r.status)) return false;
    const cur = currentApproval(r); if (!cur) return false;
    if (isHR(user) && state.ui.approvals.filter === 'all') return true;
    return effectiveApprover(cur.approverId) === userId || (isHR(user) && cur.role === 'hr');
  });
}

function addTimeline(req, action, note, by = state.currentUserId) { req.timeline.push({ at: nowISO(), by, action, note }); }

function submitRequest(draft, editingId = null) {
  const emp = empById(draft.employeeId);
  const days = workingDays(emp, draft.start, draft.end, draft.startHalf, draft.endHalf);
  let req;
  if (editingId) {
    req = reqById(editingId);
    Object.assign(req, { typeId: draft.typeId, start: draft.start, end: draft.end, startHalf: draft.startHalf, endHalf: draft.endHalf, notes: draft.notes, coverId: draft.coverId, attachments: draft.attachments, days });
    req.status = req.status === 'draft' ? 'pending' : 'amended';
    req.approvals = [{ step: 1, role: emp.managerId ? 'manager' : 'hr', approverId: approverForStep(req, 1), status: 'pending' }];
    addTimeline(req, req.status === 'amended' ? 'amended' : 'submitted', req.status === 'amended' ? 'Request amended and resubmitted' : 'Request submitted');
  } else {
    req = {
      id: uid(), employeeId: draft.employeeId, typeId: draft.typeId, start: draft.start, end: draft.end, startHalf: draft.startHalf, endHalf: draft.endHalf,
      days, status: 'pending', notes: draft.notes || '', coverId: draft.coverId || null, reason: null, attachments: draft.attachments || [],
      createdAt: nowISO(), timeline: [], approvals: [{ step: 1, role: emp.managerId ? 'manager' : 'hr', approverId: null, status: 'pending' }],
    };
    req.approvals[0].approverId = approverForStep(req, 1);
    addTimeline(req, 'submitted', 'Request submitted');
    state.requests.unshift(req);
  }
  const approver = effectiveApprover(req.approvals[0].approverId);
  notify(approver, `${emp.name} submitted ${req.id} (${fmtRange(req.start, req.end)}, ${fmtDays(days)}).`, 'approvals', req.id);
  if (req.coverId) notify(req.coverId, `${emp.name} named you as cover for ${fmtRange(req.start, req.end)}.`, 'team-calendar', req.id);
  return req;
}
function saveDraft(draft, editingId = null) {
  const emp = empById(draft.employeeId);
  const days = workingDays(emp, draft.start, draft.end, draft.startHalf, draft.endHalf);
  let req = editingId ? reqById(editingId) : null;
  if (!req) {
    req = { id: uid(), employeeId: draft.employeeId, status: 'draft', timeline: [], approvals: [], attachments: [], createdAt: nowISO(), reason: null };
    state.requests.unshift(req);
  }
  Object.assign(req, { typeId: draft.typeId, start: draft.start, end: draft.end, startHalf: draft.startHalf, endHalf: draft.endHalf, notes: draft.notes || '', coverId: draft.coverId || null, attachments: draft.attachments || [], days });
  addTimeline(req, 'draft', 'Draft saved');
  return req;
}
function decideRequest(req, decision, note) {
  const cur = currentApproval(req); if (!cur) return;
  cur.status = decision; cur.at = nowISO(); cur.by = state.currentUserId; cur.note = note;
  const by = me();
  if (decision === 'rejected') {
    req.status = 'rejected'; req.reason = note;
    addTimeline(req, 'rejected', `Rejected by ${by.name}: ${note}`);
    notify(req.employeeId, `${by.name} rejected your request ${req.id}: ${note}`, 'my-leave', req.id);
  } else if (decision === 'changes') {
    cur.status = 'pending';
    addTimeline(req, 'changes', `${by.name} requested changes: ${note}`);
    notify(req.employeeId, `${by.name} requested changes to ${req.id}: ${note}`, 'my-leave', req.id);
  } else {
    // approved this step — does the chain need HR?
    const needsHR = state.policy.hrSecondStep && cur.step === 1 && cur.role !== 'hr' && req.days > state.policy.hrApprovalThresholdDays;
    if (needsHR) {
      req.approvals.push({ step: 2, role: 'hr', approverId: 'e12', status: 'pending' });
      addTimeline(req, 'approved', `Step 1 approved by ${by.name} — routed to HR (over ${state.policy.hrApprovalThresholdDays} days)`);
      notify('e12', `${req.id} (${empById(req.employeeId).name}, ${fmtDays(req.days)}) needs HR second-step approval.`, 'approvals', req.id);
      notify(req.employeeId, `${by.name} approved ${req.id}; awaiting HR second-step approval.`, 'my-leave', req.id);
    } else {
      req.status = 'approved';
      addTimeline(req, 'approved', `Approved by ${by.name}${note ? ': ' + note : ''}`);
      notify(req.employeeId, `${by.name} approved your request ${req.id} (${fmtRange(req.start, req.end)}).`, 'my-leave', req.id);
    }
  }
}
function cancelRequest(req, mode = 'cancelled', note = '') {
  req.status = 'cancelled';
  req.approvals.forEach(a => { if (a.status === 'pending') a.status = 'withdrawn'; });
  addTimeline(req, mode === 'withdrawn' ? 'withdrawn' : 'cancelled', mode === 'withdrawn' ? 'Withdrawn by employee' : (note || 'Cancelled by employee'));
}
function escalateRequest(req) {
  const cur = currentApproval(req); if (!cur) return;
  const emp = empById(cur.approverId);
  const next = emp?.managerId || 'e12';
  addTimeline(req, 'escalated', `Escalated from ${emp?.name || 'approver'} to ${empById(next).name} (SLA breach)`);
  cur.approverId = next; cur.escalated = true;
  notify(next, `${req.id} escalated to you after ${waitingDays(req)} days without decision.`, 'approvals', req.id);
}

function toast(text, kind = 'info', ms = 4200) {
  const el = document.createElement('div');
  el.className = `toast ${kind}`;
  el.innerHTML = `<span class="alert-ico" aria-hidden="true">${kind === 'success' ? ICON.ok : kind === 'error' ? ICON.error : kind === 'warn' ? ICON.warn : ICON.info}</span><div>${esc(text)}</div><button class="close" aria-label="Dismiss">×</button>`;
  el.querySelector('.alert-ico svg').style.cssText = 'width:18px;height:18px;fill:currentColor;flex:none';
  $('#toasts').appendChild(el);
  const remove = () => { el.remove(); };
  el.querySelector('.close').addEventListener('click', remove);
  setTimeout(remove, ms);
}
let lastFocus = null;
function openLayer(html) {
  lastFocus = document.activeElement;
  const layer = $('#layer');
  layer.innerHTML = html;
  const focusable = layer.querySelector('[data-autofocus], input, select, textarea, button');
  if (focusable) setTimeout(() => focusable.focus(), 30);
  document.body.style.overflow = 'hidden';
}
function closeLayer() {
  $('#layer').innerHTML = '';
  document.body.style.overflow = '';

}
/* Generic confirm modal → Promise<boolean|string>. If `textarea` is true the
   promise resolves with the entered text (or false on cancel). */
function confirmModal({ title, body, confirmText = 'Confirm', danger = false, textarea = false, placeholder = '', required = false }) {
  return new Promise(resolve => {
    openLayer(`
      <div class="scrim" data-scrim>
        <div class="modal" role="dialog" aria-modal="true" aria-labelledby="mTitle">
          <header><span id="mTitle">${esc(title)}</span><button class="icon-btn" data-cancel aria-label="Close">${ICON.close}</button></header>
          <div class="body">${body}
            ${textarea ? `<div class="field mt"><label for="mText">${required ? 'Reason (required)' : 'Comment (optional)'}</label><textarea id="mText" data-autofocus placeholder="${esc(placeholder)}"></textarea></div>` : ''}
          </div>
          <footer><button class="btn" data-cancel>Cancel</button><button class="btn ${danger ? 'danger' : 'primary'}" data-ok ${required ? 'disabled' : ''}>${esc(confirmText)}</button></footer>
        </div>
      </div>`);
    const layer = $('#layer');
    const done = v => { closeLayer(); resolve(v); };
    $$('[data-cancel]', layer).forEach(b => b.addEventListener('click', () => done(false)));
    layer.querySelector('[data-scrim]').addEventListener('click', e => { if (e.target.hasAttribute('data-scrim')) done(false); });
    const ta = layer.querySelector('#mText');
    if (ta && required) ta.addEventListener('input', () => { layer.querySelector('[data-ok]').disabled = !ta.value.trim(); });
    layer.querySelector('[data-ok]').addEventListener('click', () => done(textarea ? (ta.value.trim() || true) : true));
  });
}

const VIEWS = {};  // route id → render fn (registered by each view module)
function navigate(route, params = {}) {
  const hash = '#/' + route + (Object.keys(params).length ? '?' + new URLSearchParams(params).toString() : '');
  if (location.hash === hash) render(); else location.hash = hash;
}
function parseHash() {
  const h = location.hash.replace(/^#\/?/, '');
  const [path, qs] = h.split('?');
  const params = Object.fromEntries(new URLSearchParams(qs || ''));
  return { route: path || 'dashboard', params };
}
function render() {
  const { route, params } = parseHash();
  const item = navItem(route);
  const allowed = item && item.roles.includes(state.role);
  state.route = allowed ? route : 'dashboard';
  state.routeParams = params;
  if (!allowed && route !== 'dashboard') { toast(`"${item ? item.label : route}" is not available in the ${roleLabel()} role.`, 'warn'); location.hash = '#/dashboard'; return; }
  renderNav();
  $('#breadcrumb').innerHTML = `<a href="#/dashboard">Leave Manager</a><span aria-hidden="true">›</span><span aria-current="page">${esc(item.label)}</span>`;
  $('#view').innerHTML = VIEWS[state.route](params);
  $('#sidenav').classList.remove('open');
  $('#hamburger').setAttribute('aria-expanded', 'false');
  document.title = `${item.label} · Annual Leave Manager`;
  window.scrollTo({ top: 0 });

  const hl = $('#view .highlight'); if (hl) hl.scrollIntoView({ block: 'center' });
}

/* Request detail drawer (shared by many views) */
function openDrawer(id) {
  const r = reqById(id); if (!r) return;
  state.ui.drawerRequestId = id;
  const emp = empById(r.employeeId); const t = typeById(r.typeId);
  const mine = r.employeeId === state.currentUserId;
  const canAct = mine;
  const future = r.start > TODAY;
  const cur = currentApproval(r);
  const bal = t.deducts ? balanceFor(r.employeeId) : null;
  const actions = [];
  if (canAct && (PENDING.has(r.status) || r.status === 'draft')) actions.push(`<button class="btn" data-act="editReq" data-id="${r.id}">${r.status === 'draft' ? 'Continue draft' : 'Edit'}</button>`);
  if (canAct && PENDING.has(r.status)) actions.push(`<button class="btn" data-act="withdrawReq" data-id="${r.id}">Withdraw</button>`);
  if (canAct && r.status === 'approved' && future) actions.push(`<button class="btn danger" data-act="cancelReq" data-id="${r.id}">Cancel leave</button>`);
  if (canAct && r.status === 'draft') actions.push(`<button class="btn danger" data-act="deleteDraft" data-id="${r.id}">Delete draft</button>`);
  if (canAct) actions.push(`<button class="btn subtle" data-act="dupReq" data-id="${r.id}">Duplicate</button>`);

  openLayer(`

          ${bal ? `<dt>Balance after</dt><dd>${fmtDays(r.status === 'approved' ? bal.remaining : bal.remaining - r.days)} remaining of ${fmtDays(bal.total)}</dd>` : ''}
          <dt>Team</dt><dd>${esc(teamById(emp.teamId).name)}</dd>

          <dt>Notes</dt><dd>${r.notes ? esc(r.notes) : '<span class="muted">—</span>'}</dd>
          ${r.reason ? `<dt>Decision reason</dt><dd>${esc(r.reason)}</dd>` : ''}
          <dt>Attachments</dt><dd>${r.attachments.length ? r.attachments.map(a => `<span class="att">📎 ${esc(a.name)} <span class="muted">${esc(a.size)}</span></span>`).join(' ') : '<span class="muted">None</span>'}</dd>
          <dt>Approval chain</dt><dd>${r.approvals.length ? r.approvals.map(a => `<div class="small">Step ${a.step} · ${a.role === 'hr' ? 'HR' : 'Line manager'} (${esc(empById(effectiveApprover(a.approverId))?.name || '—')}) — <b>${a.status}</b>${a.escalated ? ' <span class="tag">escalated</span>' : ''}</div>`).join('') : '<span class="muted">Not yet submitted</span>'}</dd>
        </dl>
        <h4 class="mt mb">Timeline / audit trail</h4>
        <ol class="timeline">${r.timeline.map(ev => `<li class="${ev.action}"><div><b>${esc(ev.action[0].toUpperCase() + ev.action.slice(1))}</b> — ${esc(ev.note)}</div><time>${fmtDT(ev.at)} · ${esc(empById(ev.by)?.name || ev.by)}</time></li>`).join('')}</ol>
      </div>
      <footer>${actions.join('') || '<span class="muted small">No actions available for this request.</span>'}</footer>
    </aside>`);
  const layer = $('#layer');
  layer.querySelector('[data-scrim]').addEventListener('click', closeLayer);
  layer.querySelector('[data-close]').addEventListener('click', closeLayer);
}

/* Shared request actions (used by drawer, My Leave table, Approvals) */
async function requestAction(act, id) {
  const r = reqById(id); if (!r) return;
  switch (act) {
    case 'view': openDrawer(id); break;
    case 'editReq': closeLayer(); startWizard({ editingId: id }); break;
    case 'dupReq': closeLayer(); startWizard({ duplicateOf: id }); break;
    case 'withdrawReq': {
      const ok = await confirmModal({ title: 'Withdraw request?', body: `<p>Withdraw <b>${esc(r.id)}</b> (${fmtRange(r.start, r.end)}, ${fmtDays(r.days)})? It will be removed from the approval queue.</p>`, confirmText: 'Withdraw', danger: true });
      if (ok) { cancelRequest(r, 'withdrawn'); toast(`${r.id} withdrawn.`, 'success'); render(); }
      break;
    }
    case 'cancelReq': {
      const ok = await confirmModal({ title: 'Cancel approved leave?', body: `<p>Cancel <b>${esc(r.id)}</b> (${fmtRange(r.start, r.end)})? ${typeById(r.typeId).deducts ? `<b>${fmtDays(r.days)}</b> will be returned to your balance.` : ''} Your manager will be notified.</p>`, confirmText: 'Cancel leave', danger: true, textarea: true, placeholder: 'Reason for cancelling (optional)' });
      if (ok) { cancelRequest(r, 'cancelled', typeof ok === 'string' ? ok : ''); notify(empById(r.employeeId).managerId || 'e12', `${me().name} cancelled approved leave ${r.id} (${fmtRange(r.start, r.end)}).`, 'team-calendar', r.id); toast(`${r.id} cancelled — balance restored.`, 'success'); render(); }
      break;
    }
    case 'deleteDraft': {
      const ok = await confirmModal({ title: 'Delete draft?', body: '<p>This draft will be permanently removed.</p>', confirmText: 'Delete', danger: true });
      if (ok) { state.requests = state.requests.filter(x => x.id !== id); closeLayer(); toast('Draft deleted.', 'success'); render(); }
      break;
    }
    case 'approve': {
      const cov = teamCoverage(empById(r.employeeId).teamId, r.start, r.end, r.employeeId);
      const note = await confirmModal({ title: `Approve ${r.id}?`, body: `<p><b>${esc(empById(r.employeeId).name)}</b> · ${typeById(r.typeId).name} · ${fmtRange(r.start, r.end)} · <b>${fmtDays(r.days)}</b></p><p class="small muted">Team coverage on those dates: ${cov.peak} other colleague${cov.peak === 1 ? '' : 's'} off (${cov.pct}% of team).</p>`, confirmText: 'Approve', textarea: true, placeholder: 'Optional comment for the employee' });
      if (note !== false) { decideRequest(r, 'approved', typeof note === 'string' ? note : ''); toast(`${r.id} approved.`, 'success'); render(); }
      break;
    }
    case 'reject': {
      const reason = await confirmModal({ title: `Reject ${r.id}?`, body: `<p>A reason is required and will be shared with <b>${esc(empById(r.employeeId).name)}</b>.</p>`, confirmText: 'Reject', danger: true, textarea: true, required: true, placeholder: 'e.g. Insufficient team cover during the launch week' });
      if (reason) { decideRequest(r, 'rejected', reason); toast(`${r.id} rejected.`, 'warn'); render(); }
      break;
    }
    case 'changes': {
      const note = await confirmModal({ title: `Request changes to ${r.id}`, body: '<p>Describe what the employee should change. The request stays pending.</p>', confirmText: 'Send', textarea: true, required: true, placeholder: 'e.g. Could you move this to the following week?' });
      if (note) { decideRequest(r, 'changes', note); toast('Change request sent.', 'success'); render(); }
      break;
    }
    case 'escalate': { escalateRequest(r); toast(`${r.id} escalated.`, 'warn'); render(); break; }
  }
}

/* ───────────────────────────── CHARTS (inline SVG) ──────────────── */
function donutSVG(parts, size = 150, stroke = 22) {
  const total = parts.reduce((s, p) => s + p.value, 0) || 1;
  const r = (size - stroke) / 2, c = 2 * Math.PI * r; let off = 0;
  const segs = parts.filter(p => p.value > 0).map(p => {
    const len = c * p.value / total; const s = `<circle r="${r}" cx="${size / 2}" cy="${size / 2}" fill="none" stroke="${p.colour}" stroke-width="${stroke}" stroke-dasharray="${len} ${c - len}" stroke-dashoffset="${-off}" transform="rotate(-90 ${size / 2} ${size / 2})"><title>${esc(p.label)}: ${p.value}</title></circle>`; off += len; return s;
  }).join('');
  return `<svg class="chart" viewBox="0 0 ${size} ${size}" width="${size}" height="${size}" role="img" aria-label="Donut chart"><circle r="${r}" cx="${size / 2}" cy="${size / 2}" fill="none" stroke="var(--surface-3)" stroke-width="${stroke}"/>${segs}</svg>`;
}
function barChartSVG(data, { height = 220, colourFn = null, valueFmt = v => v, label = 'Bar chart' } = {}) {
  const w = 600, padL = 34, padB = 28, padT = 12, innerH = height - padB - padT;
  const max = Math.max(1, ...data.map(d => d.value));
  const nice = Math.ceil(max / 5) * 5 || 5;
  const bw = (w - padL - 10) / data.length;
  const grid = [0, .25, .5, .75, 1].map(f => { const y = padT + innerH - f * innerH; return `<line class="grid-line" x1="${padL}" x2="${w}" y1="${y}" y2="${y}"/><text x="${padL - 6}" y="${y + 4}" text-anchor="end">${Math.round(nice * f)}</text>`; }).join('');
  const bars = data.map((d, i) => { const h = innerH * d.value / nice; const x = padL + i * bw + bw * .15; const y = padT + innerH - h; return `<rect class="bar" x="${x}" y="${y}" width="${bw * .7}" height="${h}" rx="3" ${colourFn ? `style="fill:${colourFn(d)}"` : ''}><title>${esc(d.label)}: ${valueFmt(d.value)}</title></rect><text x="${x + bw * .35}" y="${height - 8}" text-anchor="middle">${esc(d.short || d.label)}</text>${d.value ? `<text x="${x + bw * .35}" y="${y - 4}" text-anchor="middle" style="font-weight:600">${valueFmt(d.value)}</text>` : ''}`; }).join('');
  return `<svg class="chart" viewBox="0 0 ${w} ${height}" role="img" aria-label="${esc(label)}">${grid}${bars}</svg>`;
}
function hBarChartSVG(data, { colourFn = null, valueFmt = v => v, label = 'Bar chart' } = {}) {
  const w = 600, rowH = 30, padL = 150, h = data.length * rowH + 10;
  const max = Math.max(1, ...data.map(d => d.value));
  return `<svg class="chart" viewBox="0 0 ${w} ${h}" role="img" aria-label="${esc(label)}">${data.map((d, i) => { const y = 5 + i * rowH; const bw = (w - padL - 60) * d.value / max; return `<text x="${padL - 8}" y="${y + 19}" text-anchor="end">${esc(d.label)}</text><rect class="bar" x="${padL}" y="${y + 6}" width="${bw}" height="18" rx="3" ${colourFn ? `style="fill:${colourFn(d)}"` : ''}><title>${esc(d.label)}: ${valueFmt(d.value)}</title></rect><text x="${padL + bw + 6}" y="${y + 19}" style="font-weight:600">${valueFmt(d.value)}</text>`; }).join('')}</svg>`;
}
function lineChartSVG(data, { height = 200, valueFmt = v => v, label = 'Line chart' } = {}) {
  const w = 600, padL = 40, padB = 26, padT = 12, innerH = height - padB - padT, innerW = w - padL - 12;
  const max = Math.max(1, ...data.map(d => d.value)) * 1.15;
  const pts = data.map((d, i) => [padL + i * innerW / (data.length - 1 || 1), padT + innerH - innerH * d.value / max]);
  const grid = [0, .5, 1].map(f => { const y = padT + innerH - f * innerH; return `<line class="grid-line" x1="${padL}" x2="${w}" y1="${y}" y2="${y}"/><text x="${padL - 6}" y="${y + 4}" text-anchor="end">${valueFmt(max * f)}</text>`; }).join('');
  return `<svg class="chart" viewBox="0 0 ${w} ${height}" role="img" aria-label="${esc(label)}">${grid}<path class="line" d="${pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ')}"/>${pts.map((p, i) => `<circle class="dotp" cx="${p[0]}" cy="${p[1]}" r="3.5"><title>${esc(data[i].label)}: ${valueFmt(data[i].value)}</title></circle><text x="${p[0]}" y="${height - 8}" text-anchor="middle">${esc(data[i].short || data[i].label)}</text>`).join('')}</svg>`;
}

  eachDay(r.start, r.end, d => { if (parseISO(d).getMonth() === m && isWorkingDay(emp, d, bh)) n++; });

    const b = e.target.closest('[data-act]'); if (!b) return;
    if (b.dataset.act === 'markAllRead') { myNotifs().forEach(n => n.read = true); renderTopbar(); }
    if (b.dataset.act === 'openNotif') { const n = myNotifs().find(x => x.id === b.dataset.id); n.read = true; state.ui.notifOpen = false; $('#notifPopover').classList.add('hidden'); $('#notifBtn').setAttribute('aria-expanded', 'false'); renderTopbar(); if (n.requestId && reqById(n.requestId)) { navigate(n.route, n.route === 'my-leave' ? { highlight: n.requestId } : {}); setTimeout(() => openDrawer(n.requestId), 50); } else navigate(n.route); }
  });
  const gs = $('#globalSearch');
  gs.addEventListener('input', () => runSearch(gs.value));
  gs.addEventListener('focus', () => runSearch(gs.value));
  gs.addEventListener('keydown', e => { if (e.key === 'ArrowDown') { const f = $('#searchResults button'); if (f) { e.preventDefault(); f.focus(); } } if (e.key === 'Escape') { $('#searchResults').classList.add('hidden'); gs.blur(); } });
  $('#searchResults').addEventListener('keydown', e => { const items = $$('#searchResults button'); const i = items.indexOf(document.activeElement); if (e.key === 'ArrowDown') { e.preventDefault(); items[Math.min(items.length - 1, i + 1)]?.focus(); } if (e.key === 'ArrowUp') { e.preventDefault(); if (i === 0) gs.focus(); else items[i - 1]?.focus(); } });
  document.addEventListener('click', e => {
    if (!e.target.closest('.search')) $('#searchResults').classList.add('hidden');
    if (!e.target.closest('#notifPopover') && !e.target.closest('#notifBtn') && state.ui.notifOpen) { state.ui.notifOpen = false; $('#notifPopover').classList.add('hidden'); $('#notifBtn').setAttribute('aria-expanded', 'false'); }
  });

  // Delegated click handling for the view area and layers
  document.addEventListener('click', e => {
    const el = e.target.closest('[data-act],[data-sort],[data-type],[data-half],[data-calview],[data-admintab],[data-aprfilter],[data-toggle-type],[data-rule],[data-att-remove]');
    if (!el) return;
    if (el.dataset.sort) { const f = state.ui.myLeave; if (f.sort === el.dataset.sort) f.dir = f.dir === 'asc' ? 'desc' : 'asc'; else { f.sort = el.dataset.sort; f.dir = 'asc'; } render(); return; }
    if (el.dataset.type) { state.ui.wizard.typeId = el.dataset.type; render(); return; }
    if (el.dataset.half) { const w = state.ui.wizard; if (el.dataset.half === 'start') w.startHalf = el.dataset.val; else w.endHalf = el.dataset.val; render(); return; }
    if (el.dataset.calview) { state.ui.calendar.view = el.dataset.calview; render(); return; }
    if (el.dataset.admintab) { state.ui.admin.tab = el.dataset.admintab; render(); return; }
    if (el.dataset.aprfilter) { state.ui.approvals.filter = el.dataset.aprfilter; state.ui.approvals.selected.clear(); render(); return; }
    if (el.dataset.toggleType) { const t = typeById(el.dataset.toggleType); t.active = !t.active; toast(`${t.name} ${t.active ? 'activated' : 'deactivated'}.`, 'info', 2000); render(); return; }
    if (el.dataset.rule) { state.policy[el.dataset.rule] = !state.policy[el.dataset.rule]; toast('Rule updated.', 'info', 1800); render(); return; }
    if (el.dataset.attRemove !== undefined) { state.ui.wizard.attachments.splice(+el.dataset.attRemove, 1); render(); return; }
    const act = el.dataset.act, id = el.dataset.id;
    if (['view', 'editReq', 'dupReq', 'withdrawReq', 'cancelReq', 'deleteDraft', 'approve', 'reject', 'changes', 'escalate'].includes(act)) return requestAction(act, id);
    if (act.startsWith('wiz') || act === 'addAttachment') return wizardAction(act, el);
    if (['calPrev', 'calNext', 'calToday', 'weekPrev', 'weekNext'].includes(act)) return calendarAction(act);
    if (['selAll', 'bulkApprove', 'delegate'].includes(act)) return approvalsAction(act);
    if (['editType', 'editBlackout', 'delBlackout', 'delDelegation', 'addHoliday', 'delHoliday', 'resetData'].includes(act)) return adminAction(act, id);
    if (act === 'clearFilters') { Object.assign(state.ui.myLeave, { status: 'all', type: 'all', year: String(YEAR), q: '', highlight: null }); render(); }
    if (act === 'print') window.print();
    if (act === 'exportMine') exportRequestsCSV(state.requests.filter(r => r.employeeId === state.currentUserId), `my-leave-${me().name.replace(/\s+/g, '-').toLowerCase()}-${YEAR}.csv`);
    if (act === 'exportCSV') exportRequestsCSV(reportScope().reqs, `leave-requests-${YEAR}.csv`);
    if (act === 'exportBalances') downloadCSV(`leave-balances-${YEAR}.csv`, [['Employee', 'Team', 'FTE', 'Entitlement', 'Carry-over', 'Total', 'Taken', 'Booked', 'Pending', 'Remaining', 'Available'], ...reportScope().people.map(p => { const b = balanceFor(p.id); return [p.name, teamById(p.teamId).name, p.fte, b.entitlement, b.carryOver, b.total, b.taken, b.booked, b.pending, b.remaining, b.available]; })]);
  });
  // Delegated change/input handling
  document.addEventListener('change', e => {
    const el = e.target;
    if (el.dataset.filter) { state.ui.myLeave[el.dataset.filter] = el.value; state.ui.myLeave.highlight = null; if (el.dataset.filter !== 'q') render(); return; }
    if (el.dataset.w) { const w = state.ui.wizard; w[el.dataset.w] = el.value; if (el.dataset.w === 'start' && (!w.end || w.end < w.start)) w.end = w.start; if (w.start !== w.end && w.startHalf === 'AM') w.startHalf = ''; w.ack = false; render(); const again = $(`[data-w="${el.dataset.w}"]`); if (again && el.dataset.w !== 'notes') again.focus(); return; }
    if (el.dataset.cal) { state.ui.calendar[el.dataset.cal] = el.value; if (el.dataset.cal === 'team') state.ui.calendar.person = 'all'; render(); return; }
    if (el.hasAttribute('data-aprsort')) { state.ui.approvals.sort = el.value; render(); return; }
    if (el.hasAttribute('data-rpteam')) { state.ui.reports.team = el.value; render(); return; }
    if (el.dataset.sel) { const s = state.ui.approvals.selected; el.checked ? s.add(el.dataset.sel) : s.delete(el.dataset.sel); render(); return; }
    if (el.id === 'wAck') { state.ui.wizard.ack = el.checked; render(); return; }
    if (el.dataset.calc) { calcState[el.dataset.calc] = el.type === 'date' ? el.value : Number(el.value); render(); return; }
    if (el.dataset.ent) { const emp = empById(el.dataset.emp); const k = el.dataset.ent; emp[k] = k === 'managerId' ? (el.value || null) : Number(el.value); if (k === 'carryOver') emp.carryOver = clamp(emp.carryOver, 0, state.policy.carryOverMax); toast(`${emp.name}: ${k} updated.`, 'success', 1800); render(); return; }
    if (el.dataset.rulenum) { state.policy[el.dataset.rulenum] = Number(el.value); toast('Threshold updated.', 'info', 1800); render(); return; }
    if (el.dataset.ruledate) { state.policy[el.dataset.ruledate] = el.value; toast('Carry-over expiry updated.', 'info', 1800); render(); return; }
  });
  document.addEventListener('input', e => {
    const el = e.target;
    if (el.dataset.filter === 'q') { state.ui.myLeave.q = el.value; const pos = el.selectionStart; render(); const again = $('#flQ'); if (again) { again.focus(); again.setSelectionRange(pos, pos); } }
    if (el.dataset.w === 'notes') { state.ui.wizard.notes = el.value; const help = el.parentElement.querySelector('.help'); if (help) help.textContent = `${el.value.length}/300`; }
  });
  // Keyboard shortcuts
  document.addEventListener('keydown', e => {
    const tag = document.activeElement?.tagName; const typing = ['INPUT', 'TEXTAREA', 'SELECT'].includes(tag);
    if (e.key === 'Escape') { if ($('#layer').children.length) { closeLayer(); return; } if (state.ui.notifOpen) { $('#notifBtn').click(); } return; }
    if (typing || e.ctrlKey || e.metaKey || e.altKey) return;
    if (e.key === 'n' || e.key === 'N') { e.preventDefault(); startWizard(); }
    else if (e.key === '/') { e.preventDefault(); $('#globalSearch').focus(); }
    else if (e.key === 't' || e.key === 'T') applyTheme(state.theme === 'dark' ? 'light' : 'dark');
    else if (e.key === '?') openAbout();
    else if (/^[1-8]$/.test(e.key)) { const items = NAV.filter(n => n.roles.includes(state.role)); const n = items[+e.key - 1]; if (n) navigate(n.id); }
  });
}

/* ───────────────────────────── BOOT ─────────────────────────────── */
function boot() {
  // Theme: stored preference → OS preference → light
  const stored = safeStore.get('alm-theme');
  const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
  applyTheme(stored || (prefersDark ? 'dark' : 'light'));
  seedStore();
  wireEvents();
  renderTopbar();
  // First-paint skeleton, then render
  $('#view').innerHTML = `<div class="grid kpis mb">${'<div class="skeleton" style="height:92px"></div>'.repeat(6)}</div><div class="grid three">${'<div class="skeleton" style="height:260px"></div>'.repeat(3)}</div>`;
  $('#sidenav').innerHTML = `<div class="stack" style="padding:8px">${'<div class="skeleton" style="height:36px"></div>'.repeat(7)}</div>`;
  setTimeout(() => { state.ui.booted = true; render(); toast('Welcome, Ryan. Sample data loaded — nothing is persisted.', 'info', 3500); }, 450);
}
/* Expose a small namespace for debugging / automation (read-only intent). */
window.ALM = { state, navigate, render, setRole, startWizard, openDrawer, closeLayer, openAbout, balanceFor, workingDays, validateRequest, approvalQueue, reqById, empById, NAV, applyTheme };
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();
</script>
</body>
